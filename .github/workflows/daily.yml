name: Legends Desk 데일리 발송

on:
  schedule:
    # 깃헙 cron은 UTC 기준. 22:10 UTC (일~목) = 한국시간 07:10 (월~금)
    # 깃헙 서버 사정으로 10~30분 늦게 시작될 수 있어요.
    - cron: "10 22 * * 0-4"
  workflow_dispatch:
    inputs:
      ticker:
        description: "올릴 종목 (비우면 queue.txt → rotation.txt 순서)"
        required: false
        default: ""
      dry_run:
        description: "텔레그램에 올리지 않고 결과 이미지만 확인"
        type: boolean
        default: false
      test_telegram:
        description: "텔레그램 연결 테스트 메시지만 보내기"
        type: boolean
        default: false

permissions:
  contents: write   # 발송 후 queue.txt / history.csv 를 저장소에 다시 커밋

concurrency:
  group: legends-desk
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Seoul
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 키 노출 검사 (저장소에 키가 올라가 있으면 여기서 멈춤)
        run: python scripts/check_secrets.py

      - name: 한글 폰트 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum && fc-cache -f

      - name: 파이썬 패키지 설치
        run: pip install -r requirements.txt

      - name: Claude Code CLI 설치
        if: ${{ !inputs.test_telegram }}
        run: npm install -g @anthropic-ai/claude-code

      - name: 분석 + 텔레그램 발송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          TICKER_INPUT: ${{ inputs.ticker }}
          DRY_RUN: ${{ inputs.dry_run }}
          TEST_TG: ${{ inputs.test_telegram }}
        run: |
          ARGS=()
          [ -n "$TICKER_INPUT" ] && ARGS+=(--ticker "$TICKER_INPUT")
          [ "$DRY_RUN" = "true" ] && ARGS+=(--dry-run)
          [ "$TEST_TG" = "true" ] && ARGS+=(--test-telegram)
          python -m src.main "${ARGS[@]}"

      - name: 결과 이미지 보관 (Actions 실행 화면에서 내려받기)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legends-desk-${{ github.run_number }}
          path: out/
          if-no-files-found: ignore
          retention-days: 14

      - name: 큐·기록 저장
        if: success()
        run: |
          git config user.name "legends-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tickers/queue.txt data/history.csv
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "발송 기록 $(date +%Y-%m-%d)"
            git push
          fi
